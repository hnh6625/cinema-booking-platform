spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:cinema}
    username: ${DB_USER:cinema_user}
    password: ${DB_PASSWORD:}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  admin:
    email: ${ADMIN_EMAIL:admin@cinema.local}
    phone: ${ADMIN_PHONE:+84900000001}
    password: ${ADMIN_PASSWORD:admin-dev-password}