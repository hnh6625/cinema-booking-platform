spring:
  application:
    name: cinema
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    jwt:
      access-token-ttl: 15m
      refresh-token-ttl: 7d