name: CI

on:
  pull_request:
  push:
    branches:
      - [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: action/checkout@v4

      - uses: action/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run all test
        run: .\mvnw -B verify